name: Notify members on new post

# data/mail_queue.csv 에 새 행이 커밋되면(=admin에서 새 논문/뉴스/앨범 첫 생성) 실행.
# 아직 안 보낸(sent 빈칸) 항목만 발송하고, 발송한 항목엔 sent 표시를 커밋 → 중복 발송 방지.
on:
  push:
    branches: [main]
    paths:
      - data/mail_queue.csv
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능 (최신 코드로)

permissions:
  contents: write

concurrency:
  group: notify-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 최신 main 에서 작업 + sent 표시 push
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Send unsent queue items
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.MAIL_USERNAME }}
        run: python .github/scripts/send_mail.py
      - name: Persist sent flags
        if: always()
        run: |
          if ! git diff --quiet -- data/mail_queue.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/mail_queue.csv
            git commit -m "Mark mail queue items as sent [skip ci]"
            git push
          else
            echo "no queue change"
          fi
